[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lpaetsoo-inference_trace_instrumentation_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测多模态评测工程师·推理链路的追踪埋点相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lpaetsoo" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lpaetsoo.github.io"
Repository = "https://github.com/lpaetsoo/inference_trace_instrumentation_consistency_check"
Issues = "https://github.com/lpaetsoo/inference_trace_instrumentation_consistency_check/issues"

[project.scripts]
inference_trace_instrumentation_consistency_check = "inference_trace_instrumentation_consistency_check:main"

[tool.setuptools]
py-modules = ["inference_trace_instrumentation_consistency_check"]
